<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 280px;
        background: #1a1a2e;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
      }

      .container {
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
      }

      .logo-icon {
        width: 36px;
        height: 36px;
        background: #ff0050;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      .logo-text {
        font-size: 16px;
        font-weight: 700;
        background: linear-gradient(135deg, #ff0050, #ff6b6b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .speed-display {
        background: linear-gradient(135deg, #16213e, #0f3460);
        border: 1px solid #1a3a6a;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 20px;
        text-align: center;
        width: 100%;
        position: relative;
        overflow: hidden;
      }

      .speed-display::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #ff0050, transparent);
      }

      .speed-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #8892b0;
        margin-bottom: 8px;
      }

      .speed-value {
        font-size: 48px;
        font-weight: 800;
        background: linear-gradient(135deg, #ff0050, #ff6b6b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
      }

      .speed-unit {
        font-size: 14px;
        color: #8892b0;
        margin-left: 4px;
      }

      .slider-container {
        width: 100%;
        margin-bottom: 20px;
      }

      .slider-wrapper {
        position: relative;
        padding: 12px 0;
      }

      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        background: linear-gradient(90deg, #1a3a6a, #0f3460);
        border-radius: 4px;
        outline: none;
        cursor: pointer;
      }

      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 22px;
        height: 22px;
        background: linear-gradient(135deg, #ff0050, #ff4070);
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(255, 0, 80, 0.5);
        border: 3px solid #fff;
        transition: transform 0.15s;
      }

      input[type='range']::-webkit-slider-thumb:hover {
        transform: scale(1.15);
      }

      input[type='range']::-moz-range-thumb {
        width: 22px;
        height: 22px;
        background: linear-gradient(135deg, #ff0050, #ff4070);
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(255, 0, 80, 0.5);
        border: 3px solid #fff;
      }

      .slider-labels {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        font-size: 11px;
        color: #5a6a8a;
      }

      .presets {
        display: flex;
        gap: 6px;
        width: 100%;
        margin-bottom: 16px;
      }

      .preset-btn {
        flex: 1;
        padding: 8px 0;
        background: linear-gradient(135deg, #16213e, #1a1a2e);
        border: 1px solid #2a3a5a;
        border-radius: 8px;
        color: #8892b0;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
      }

      .preset-btn:hover {
        border-color: #ff0050;
        color: #ff0050;
        background: rgba(255, 0, 80, 0.1);
      }

      .preset-btn.active {
        border-color: #ff0050;
        color: #ff0050;
        background: rgba(255, 0, 80, 0.15);
      }

      .status {
        font-size: 11px;
        color: #5a6a8a;
        text-align: center;
      }

      .status.youTube {
        color: #4ade80;
      }

      .pulse {
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <div class="logo-icon">▶</div>
        <div class="logo-text">Speed Control</div>
      </div>

      <div class="speed-display">
        <div class="speed-label">Скорость воспроизведения</div>
        <div>
          <span class="speed-value" id="speedValue">1.0</span>
          <span class="speed-unit">x</span>
        </div>
      </div>

      <div class="slider-container">
        <div class="slider-wrapper">
          <input
            type="range"
            id="speedSlider"
            min="1"
            max="5"
            step="0.1"
            value="1"
          />
        </div>
        <div class="slider-labels">
          <span>1x</span>
          <span>2x</span>
          <span>3x</span>
          <span>4x</span>
          <span>5x</span>
        </div>
      </div>

      <div class="presets">
        <button class="preset-btn" data-speed="1">1x</button>
        <button class="preset-btn" data-speed="1.5">1.5x</button>
        <button class="preset-btn" data-speed="2">2x</button>
        <button class="preset-btn" data-speed="3">3x</button>
        <button class="preset-btn" data-speed="5">5x</button>
      </div>

      <div class="status" id="status">Откройте YouTube</div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
